services:

  api:

    build: .

    container_name: research-api

    restart: unless-stopped

    ports:
      - "8000:8000"

    env_file:
      - .env

    depends_on:
      - redis

    volumes:
      - .:/app

  redis:

    image: redis:7-alpine

    container_name: research-redis

    restart: unless-stopped

    ports:
      - "6379:6379"